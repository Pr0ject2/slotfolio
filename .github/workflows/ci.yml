name: Slotfolio CI

on:
  pull_request:
    branches: ["main", "master"]

permissions:
  contents: read

concurrency:
  group: "ci-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck source and tests
        run: npm run typecheck

      - name: Run Play'n GO passport profiler
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: npx playwright test tests/000-playngo-passport-profile-7.spec.ts

      - name: Upload Play'n GO passport profile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playngo-passport-profile
          path: playngo-profile.json
          if-no-files-found: error
