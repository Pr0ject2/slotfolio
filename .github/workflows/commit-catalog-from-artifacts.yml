name: Commit 1000 Slot Catalog

on:
  push:
    branches: ["fix/v129-unique-100"]
    paths:
      - ".github/workflows/commit-catalog-from-artifacts.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: "commit-catalog-artifacts-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  commit-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/v129-unique-100

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Download verified harvest artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts
          gh api /repos/Pr0ject2/slotfolio/actions/artifacts/10070812831/zip > /tmp/core.zip
          gh api /repos/Pr0ject2/slotfolio/actions/artifacts/10071955229/zip > /tmp/wazdan.zip
          gh api /repos/Pr0ject2/slotfolio/actions/artifacts/10072082436/zip > /tmp/3oaks.zip
          unzip -oq /tmp/core.zip -d artifacts
          unzip -oq /tmp/wazdan.zip -d artifacts
          unzip -oq /tmp/3oaks.zip -d artifacts
          test -f artifacts/catalog-browser.json
          test -f artifacts/catalog-wazdan.json
          test -f artifacts/catalog-3oaks.json

      - name: Curate verified catalog pool
        run: node scripts/build-catalog-seeds.mjs

      - name: Commit catalog seeds
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/catalog-seeds.json
          git commit -m "Populate verified catalog seed pool"
          git push origin HEAD:fix/v129-unique-100
