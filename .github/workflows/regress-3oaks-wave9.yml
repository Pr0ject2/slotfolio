name: Wave9 artwork browser regression

on:
  push:
    branches: ["fix/catalog-artwork-wave9-20261003"]
    paths:
      - ".github/workflows/regress-3oaks-wave9.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resolve Sun of Egypt official banner
        shell: bash
        run: |
          node <<'NODE'
          const key="sun_of_egypt";
          const api=await fetch(`https://3oaks.com/api/v1/games/${key}`,{headers:{accept:"application/json","user-agent":"SlotfolioImageProbe/1.3"}});
          const json=await api.json();
          const path=json?.data?.banner_file;
          const image=path ? new URL(path,"https://3oaks.com").toString() : null;
          let imageStatus=null, contentType=null, length=null;
          if(image){
            const r=await fetch(image,{method:"HEAD",headers:{"user-agent":"SlotfolioImageProbe/1.3"}});
            imageStatus=r.status; contentType=r.headers.get("content-type"); length=r.headers.get("content-length");
          }
          console.log(JSON.stringify({key,apiStatus:api.status,banner:path,image,imageStatus,contentType,length}));
          if(api.status!==200 || imageStatus!==200) process.exit(1);
          NODE
