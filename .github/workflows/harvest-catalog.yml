name: Harvest Slot Catalog

on:
  push:
    branches: ["fix/v129-unique-100"]
    paths:
      - "scripts/harvest-catalog.mjs"
      - "scripts/harvest-catalog-browser.mjs"
      - ".github/workflows/harvest-catalog.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "catalog-harvest-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Harvest static provider catalogs
        run: node scripts/harvest-catalog.mjs

      - name: Harvest dynamic provider catalogs
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: node scripts/harvest-catalog-browser.mjs

      - name: Upload harvested catalog
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: slot-catalog-harvest
          path: artifacts/catalog-*.json
          if-no-files-found: error
          retention-days: 1
