name: Deploy Slotfolio to GitHub Pages

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Setup GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Cache localized slot images
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .asset-cache/slot-images
            public/images/slots
            public/images/catalog
          key: slot-images-${{ runner.os }}-${{ hashFiles('docs/image-sources.json', 'docs/image-sources-v128.json', 'docs/image-sources-v129.json', 'docs/image-sources-v130.json', 'scripts/localize-slot-images.mjs') }}
          restore-keys: |
            slot-images-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck source and tests
        run: npm run typecheck

      - name: Localize slot artwork for preview
        shell: bash
        run: |
          for attempt in 1 2 3; do
            echo "Artwork localization attempt ${attempt}/3"
            if npm run assets:localize; then
              exit 0
            fi
            if [ "${attempt}" -lt 3 ]; then
              sleep $((attempt * 20))
            fi
          done
          echo "Reviewed artwork is still incomplete after 3 attempts; refusing to publish placeholders."
          exit 1

      - name: Build static site
        shell: bash
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          export NEXT_PUBLIC_BASE_PATH="/${REPO_NAME}"
          export NEXT_PUBLIC_SITE_URL="https://${GITHUB_REPOSITORY_OWNER}.github.io/${REPO_NAME}"
          export NEXT_PUBLIC_INDEXABLE="${{ vars.NEXT_PUBLIC_INDEXABLE }}"

          # GitHub Pages is static hosting. The server-side affiliate redirect
          # remains in the source project, but is omitted from this preview build.
          rm -f 'src/app/go/[operator]/route.ts'

          # Artwork localization above is strict. A Pages release must not publish
          # reviewed cards with missing local artwork.
          npx next build
          touch out/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ./out

  deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
