name: Security one-shot lockfile commit
on:
  push:
    branches: ["security/harden-pipeline-next-20261012"]
    paths: [".github/workflows/security-lockfile-commit-temporary.yml"]
permissions:
  contents: write
jobs:
  update-lock:
    if: github.repository == 'Pr0ject2/slotfolio'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Generate and verify previously audited lockfile
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund next@16.3.8 --save-exact
          printf '%s  %s\n' '2d03921368c49449edad5b7f25d2b2da00e44afd11c116eb3f72bf34180dbf7a' 'package-lock.json' | sha256sum -c -
      - name: Commit only the verified npm lockfile to this security branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- package-lock.json
          git commit -m 'Lock patched Next.js 16.3.8 with npm integrity metadata'
          git push origin HEAD:security/harden-pipeline-next-20261012
