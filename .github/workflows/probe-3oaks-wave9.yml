name: Probe 3 Oaks wave9 images

on:
  push:
    branches: ["fix/catalog-artwork-wave9-20261003"]
    paths:
      - ".github/workflows/probe-3oaks-wave9.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify official banners
        shell: bash
        run: |
          node <<'NODE'
          const keys=["moon_sisters","more_magic_apple","power_sun","power_sun_xxl","purple_diamond","rio_gems","rush_for_gold","scarab_temple","sky_pearls","space_coins"];
          for(const key of keys){
            const api=await fetch(`https://3oaks.com/api/v1/games/${key}`,{headers:{accept:"application/json","user-agent":"SlotfolioImageProbe/1.2"}});
            const json=await api.json();
            const path=json?.data?.banner_file;
            const image=path ? new URL(path,"https://3oaks.com").toString() : null;
            let imageStatus=null, contentType=null, length=null;
            if(image){
              const r=await fetch(image,{method:"HEAD",headers:{"user-agent":"SlotfolioImageProbe/1.2"}});
              imageStatus=r.status; contentType=r.headers.get("content-type"); length=r.headers.get("content-length");
            }
            console.log(JSON.stringify({key,apiStatus:api.status,banner:path,image,imageStatus,contentType,length}));
          }
          NODE
