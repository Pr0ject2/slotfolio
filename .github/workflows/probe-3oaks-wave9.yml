name: Probe 3 Oaks wave9 images

on:
  push:
    branches: ["fix/catalog-artwork-wave9-20261003"]
    paths:
      - ".github/workflows/probe-3oaks-wave9.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch official API image fields
        shell: bash
        run: |
          node <<'NODE'
          const keys = [
            "moon_sisters",
            "more_magic_apple",
            "power_sun",
            "power_sun_xxl",
            "purple_diamond",
            "rio_gems",
            "rush_for_gold",
            "scarab_temple",
            "sky_pearls",
            "space_coins",
          ];
          function walk(value, path = [], out = []) {
            if (typeof value === "string" && /^https?:\/\//i.test(value) && /(image|img|media|banner|thumb|gallery|\.png|\.jpe?g|\.webp)/i.test(value)) {
              out.push({ path: path.join("."), value });
            } else if (Array.isArray(value)) {
              value.forEach((v, i) => walk(v, [...path, String(i)], out));
            } else if (value && typeof value === "object") {
              for (const [k, v] of Object.entries(value)) walk(v, [...path, k], out);
            }
            return out;
          }
          for (const key of keys) {
            const url = `https://3oaks.com/api/v1/games/${key}`;
            const response = await fetch(url, { headers: { accept: "application/json", "user-agent": "SlotfolioImageProbe/1.0" } });
            console.log("===GAME===", key, "STATUS", response.status);
            const text = await response.text();
            if (!response.ok) { console.log(text.slice(0, 1000)); continue; }
            const data = JSON.parse(text);
            const urls = walk(data);
            console.log(JSON.stringify(urls, null, 2));
          }
          NODE
