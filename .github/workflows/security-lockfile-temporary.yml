name: Security patch lockfile artifact
on:
  push:
    branches: ["security/harden-pipeline-next-20261012"]
    paths:
      - "package.json"
      - ".github/workflows/security-lockfile-temporary.yml"
permissions:
  contents: read
jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Generate exact lockfile from official npm registry
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund next@16.3.8 --save-exact
      - name: Upload generated lockfile
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: regenerated-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1
