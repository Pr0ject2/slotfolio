name: Security one-shot audit remediation
on:
  push:
    branches: ["security/harden-pipeline-next-20261012"]
    paths: [".github/workflows/security-audit-fix-temporary.yml"]
permissions:
  contents: write
jobs:
  patch-lock:
    if: github.repository == 'Pr0ject2/slotfolio'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Patch high-severity vulnerable dependencies using official npm metadata
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --save-optional sharp@0.35.5
          npm audit fix --package-lock-only --ignore-scripts --no-fund
          npm audit --audit-level=high
          node -e 'const p=require("./package-lock.json").packages; if(p["node_modules/next"].version!=="16.3.8" || p["node_modules/sharp"].version!=="0.35.5") process.exit(1)'
      - name: Commit exactly the amended dependency manifests to the security branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- package.json package-lock.json
          git commit -m 'Resolve npm audit high vulnerabilities in sharp and source-map-js'
          git push origin HEAD:security/harden-pipeline-next-20261012
